name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest
      - name: Dry-run fixture photos
        env:
          SLOTH_FAKE_GEMMA: "1"
        run: |
          python -m sloth run --input tests/fixtures/real --dry-run | tee dry-run-summary.txt
      - name: Upload dry-run summary
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-summary
          path: dry-run-summary.txt
